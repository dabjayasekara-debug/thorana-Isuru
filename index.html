const imageCache = {};
let offCanvas = document.createElement('canvas');
let offCtx = offCanvas.getContext('2d', {alpha: false});

function animateMatrices() {
    matrices.forEach(el => {
        let canvasDom = document.getElementById(el.id);
        if(!canvasDom) return;
        let cvs = canvasDom.querySelector('canvas') || canvasDom.firstChild;
        if(!cvs) return;
        let ctx = cvs.getContext('2d');
        let w = el.w; let h = el.h;
        
        if(cvs.width !== w) cvs.width = w;
        if(cvs.height !== h) cvs.height = h;
        
        let cols = parseInt(el.cols) || 40;
        let rows = parseInt(el.rows) || 20;
        
        if (el._internalScroll === undefined) el._internalScroll = 0;
        if (el._imgIndex === undefined) el._imgIndex = 0;
        
        offCanvas.width = cols * 2 + 100; 
        offCanvas.height = rows;
        offCtx.imageSmoothingEnabled = false;
        offCtx.fillStyle = 'black';
        offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
        
        if(el.imageSources && el.imageSources.length > 0) {
            if (el._imgIndex >= el.imageSources.length) el._imgIndex = 0;
            
            let currentSrc = el.imageSources[el._imgIndex];
            let cacheKey = el.id + '_' + el._imgIndex;
            
            if(!imageCache[cacheKey] || imageCache[cacheKey].source !== currentSrc) {
                let img = new Image();
                img.src = currentSrc;
                imageCache[cacheKey] = { source: currentSrc, img: img };
            }
            
            let img = imageCache[cacheKey].img;
            if(img.complete && img.width > 0) {
                let aspect = img.width / img.height;
                let drawW = rows * aspect;
                let drawH = rows;
                let totalScrollDist = drawW + cols;
                
                el._internalScroll += (el.speed / 10);
                if (el._internalScroll >= totalScrollDist) {
                    el._internalScroll = 0;
                    el._imgIndex = (el._imgIndex + 1) % el.imageSources.length;
                }
                
                offCtx.drawImage(img, cols - el._internalScroll, 0, drawW, drawH);
            }
        } else {
            offCtx.fillStyle = 'white';
            offCtx.textBaseline = 'middle';
            offCtx.font = 'bold ' + Math.floor(rows*0.8) + 'px sans-serif';
            let textWidth = offCtx.measureText(el.text).width;
            let totalScrollDist = textWidth + cols;
            
            el._internalScroll += (el.speed / 10);
            if (el._internalScroll >= totalScrollDist) {
                el._internalScroll = 0;
            }
            
            offCtx.fillText(el.text, cols - el._internalScroll, rows/2);
        }
        
        let imgData = offCtx.getImageData(0,0,cols,rows).data;
        ctx.clearRect(0,0,w,h);
        
        let renderLED = (cx, cy, radius, idx) => {
            let rVal = imgData[idx]; let gVal = imgData[idx+1]; let bVal = imgData[idx+2]; let aVal = imgData[idx+3];
            let isVisible = aVal > 50 && (rVal > 30 || gVal > 30 || bVal > 30);
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI*2);
            if(isVisible) {
                if(el.imageSources && el.imageSources.length > 0) {
                    ctx.fillStyle = 'rgb(' + rVal + ',' + gVal + ',' + bVal + ')';
                } else {
                    ctx.fillStyle = el.color;
                }
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 8;
            } else {
                ctx.fillStyle = '#222';
                ctx.shadowBlur = 0;
            }
            ctx.fill();
        };

        let holeSize = el.holeSize !== undefined ? el.holeSize : 0;

        if (el.shape !== 'circle') {
            let ledW = w / cols;
            let ledH = h / rows;
            let radius = Math.min(ledW, ledH) * 0.4;
            
            let halfCols = (cols - 1) / 2;
            let halfRows = (rows - 1) / 2;

            let pointInPoly = (nx, ny, poly) => {
                let inside = false;
                for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                    let xi = poly[i][0], yi = poly[i][1];
                    let xj = poly[j][0], yj = poly[j][1];
                    let intersect = ((yi > ny) != (yj > ny)) && (nx < (xj - xi) * (ny - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            };
            
            let polygons = {
                triangle: [[0.5, 0], [1, 1], [0, 1]],
                diamond: [[0.5, 0], [1, 0.5], [0.5, 1], [0, 0.5]],
                hexagon: [[0.25, 0], [0.75, 0], [1, 0.5], [0.75, 1], [0.25, 1], [0, 0.5]],
                star: [[0.5, 0], [0.61, 0.35], [0.98, 0.35], [0.68, 0.57], [0.79, 0.91], [0.5, 0.70], [0.21, 0.91], [0.32, 0.57], [0.02, 0.35], [0.39, 0.35]]
            };

            for(let r=0; r<rows; r++){
                for(let c=0; c<cols; c++){
                    let distC = halfCols > 0 ? Math.abs(c - halfCols) / halfCols : 0;
                    let distR = halfRows > 0 ? Math.abs(r - halfRows) / halfRows : 0;
                    
                    if(holeSize > 0 && distC < (holeSize / 100) && distR < (holeSize / 100)) {
                        continue;
                    }
                    
                    let nx = (c + 0.5) / cols;
                    let ny = (r + 0.5) / rows;
                    
                    if (el.shape && polygons[el.shape]) {
                        if (!pointInPoly(nx, ny, polygons[el.shape])) continue;
                    }

                    let cx = c * ledW + ledW/2;
                    let cy = r * ledH + ledH/2;
                    let idx = (r * cols + c) * 4;
                    renderLED(cx, cy, radius, idx);
                }
            }
        } else if (el.shape === 'circle') {
            let centerX = w/2;
            let centerY = h/2;
            let maxRadius = Math.min(w,h)/2 * 0.95;
            let innerRadius = maxRadius * (holeSize / 100);
            
            let ringGap = (maxRadius - innerRadius) / Math.max(1, rows);
            let ledRadius = ringGap * 0.4;
            
            for(let r=0; r<rows; r++){
                let currentRadius = innerRadius + r * ringGap;
                for(let c=0; c<cols; c++){
                    let angle = (c/cols) * Math.PI*2 + Math.PI/2;
                    let cx = centerX + Math.cos(angle) * currentRadius;
                    let cy = centerY + Math.sin(angle) * currentRadius;
                    let idx = (r * cols + c) * 4;
                    renderLED(cx, cy, ledRadius, idx);
                }
            }
        }
    });
    requestAnimationFrame(animateMatrices);
}
